version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: movie_memory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: movie_memory
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
